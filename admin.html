<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم - مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9ff;--card:#fff;--ink:#16213e;--mut:#56637f;--line:#cddff7;--acc:#2540d9;--accbg:#e1e8ff;--evbg:#fff0a8;--ev:#7a5a00;--bad:#c4262e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1525;--card:#16203a;--ink:#e8edfb;--mut:#9aa6c4;--line:#26345a;--acc:#7f9bff;--accbg:#1f2c55;--evbg:#5a4a0c;--ev:#ffd84a;--bad:#ff8a8f}}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.w{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 8px}h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;width:100%;margin-top:10px}
@media(prefers-color-scheme:dark){.btn:not(.alt){color:#06201d}}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;margin:0;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top .row{flex:0 0 auto}.top .row>*{flex:0 0 auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--accbg);color:var(--acc)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.err{color:var(--bad);font-weight:700;min-height:1px;margin-top:8px}
.pwr{position:relative}.pwr input{padding-inline-end:72px}
.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--acc);font-weight:700;padding:8px}
a{color:var(--acc)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="a"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad=n=>String(n).padStart(2,'0'),fm=m=>{const h=m/60|0;return(h%12||12)+':'+pad(m%60)+(h>=12?' م':' ص')};
const dt=t=>t?new Date(t).toLocaleDateString('ar-EG'):'—';
const ago=t=>{if(!t)return'—';const d=Math.floor((Date.now()-t)/864e5);return d<1?'النهارده':d===1?'امبارح':'من '+d+' يوم'};
const rel=u=>u.religion==='m'?'مسلم':u.religion==='c'?'مسيحي'+(u.sect?' · '+u.sect:''):'—';
const st=u=>({done:Object.values(u.done||{}).filter(Boolean).length,fx:Object.values(u.focus||{}).reduce((a,b)=>a+b,0)});
let U=[],Q='',SEL=null,A,F,unsub;
const app=$('#a');
if(!window.FBC||!FBC.apiKey||!window.firebase){app.innerHTML='<div class="w"><div class="card">حط بيانات مشروع Firebase في ملف firebase-config.js الأول.</div></div>'}
else{
 firebase.initializeApp(FBC);A=firebase.auth();F=firebase.firestore();
 A.onAuthStateChanged(u=>{if(unsub){unsub();unsub=null}u?listen():login()});
}
function login(msg){app.innerHTML=`<div class="w"><h1>لوحة التحكم</h1><div class="card"><label for="em">الإيميل</label><input id="em" type="email" autocomplete="username"><label for="pw">كلمة السر</label><div class="pwr"><input id="pw" type="password" autocomplete="current-password"><button class="eye" type="button" onclick="const i=$('#pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'إظهار':'إخفاء'">إظهار</button></div><div class="err">${esc(msg||'')}</div><button class="btn" onclick="go()">دخول</button></div></div>`}
function go(){A.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>login('الإيميل أو كلمة السر غلط.'))}
function listen(){unsub=F.collection('users').onSnapshot(s=>{U=s.docs.map(d=>d.data());SEL?detail():view()},()=>{app.innerHTML='<div class="w"><div class="card">مفيش صلاحية لعرض البيانات. اتأكد إنك داخل بإيميل الأدمن المكتوب في قواعد Firestore.</div><button class="btn" onclick="A.signOut()">خروج</button></div>'})}
function view(){
 const w=Date.now()-7*864e5,act=U.filter(u=>u.lastActive>w).length,m=U.filter(u=>u.religion==='m').length;
 app.innerHTML=`<div class="w"><div class="top"><h1>لوحة التحكم</h1><div class="row"><button class="btn alt sm" onclick="csv()">تصدير Excel</button><button class="btn alt sm" onclick="A.signOut()">خروج</button></div></div>
 <div class="card row"><div><b>${U.length}</b><div class="mut">مسجل</div></div><div><b>${act}</b><div class="mut">نشط آخر 7 أيام</div></div><div><b>${m}</b><div class="mut">مسلم</div></div><div><b>${U.filter(u=>u.religion==='c').length}</b><div class="mut">مسيحي</div></div></div>
 <input id="q" placeholder="ابحث بالاسم أو الرقم أو المكان" value="${esc(Q)}" oninput="Q=this.value;list()" aria-label="بحث"><div id="ls" style="margin-top:10px"></div></div>`;list();
}
function list(){
 const q=Q.trim().toLowerCase(),r=U.filter(u=>!q||[u.name,u.phone,u.email,u.place,u.region,u.country].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
 $('#ls').innerHTML=r.map(u=>{const s=st(u);return`<div class="card" style="cursor:pointer" onclick="SEL='${esc(u.phone)}';detail()"><b>${esc(u.name)}</b> <span class="badge">${rel(u)}</span><div class="mut">${esc(u.phone)} · ${esc(u.place||'')}</div><div class="mut">آخر نشاط: ${ago(u.lastActive)} · ${(u.events||[]).length} موعد · ${s.done} فترة مكتملة</div></div>`}).join('')||'<div class="mut">مفيش نتايج.</div>';
}
const METHN={egypt:'المساحة المصرية',mwl:'رابطة العالم الإسلامي',isna:'أمريكا الشمالية',karachi:'كراتشي',umm:'أم القرى'};
function detail(){
 const u=U.find(x=>x.phone===SEL);if(!u){SEL=null;return view()}
 const s=st(u),L=(a,f)=>(a||[]).map(f).join('')||'<span class="mut">—</span>',R=(k,v)=>`<div class="li"><span>${k}</span><span style="text-align:left">${v}</span></div>`;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return{k,dn:Object.keys(u.done||{}).filter(x=>u.done[x]&&x.startsWith(k+'-')).length,fx:(u.focus||{})[k]||0}});
 const loc=[u.country,u.region||u.gov].filter(Boolean).join(' - ')||'—';
 app.innerHTML=`<div class="w"><button class="btn alt sm" onclick="SEL=null;view()">رجوع للقائمة</button><h2 style="margin-top:12px">${esc(u.name)}</h2>
 <div class="card">${R('الاسم المسجل',esc(u.name))}${R('الرقم',`<a href="tel:${esc(u.phone)}">${esc(u.phone)}</a> · <a href="https://wa.me/${esc(u.phone)}" target="_blank" rel="noopener">واتساب</a>`)}${R('الإيميل',u.email?`<a href="mailto:${esc(u.email)}">${esc(u.email)}</a>`:'—')}
 ${R('الديانة',rel(u))}${R('المرحلة الدراسية',esc([u.stage,u.grade,u.track].filter(Boolean).join(' - ')||'—'))}${R('الدولة - المحافظة / المنطقة',esc(loc))}${R('المكان المسجل',esc(u.place||'—'))}
 ${R('الإحداثيات',u.lat!=null?`<a href="https://maps.google.com/?q=${esc(u.lat)},${esc(u.lng)}" target="_blank" rel="noopener">${Number(u.lat).toFixed(3)}, ${Number(u.lng).toFixed(3)} (خريطة)</a>`:'—')}
 ${u.religion==='m'?R('طريقة حساب الصلاة',METHN[u.method]||'—'):R('تقويم الفصح',u.eas==='w'?'غربي':'شرقي')}
 ${R('إشعارات التليفون',u.push?'مفعّلة':'غير مفعّلة')}${R('المنطقة الزمنية',esc(u.tz||'توقيت جهاز الطالب'))}${R('تاريخ التسجيل',dt(u.createdAt))}${R('آخر نشاط',u.lastActive?new Date(u.lastActive).toLocaleString('ar-EG'):'—')}${R('وافق على حفظ البيانات',dt(u.consentAt))}
 ${R('وقت المذاكرة اليومي',u.ss!=null?fm(u.ss)+' - '+fm(u.se):'—')}${R('إجمالي الفترات المكتملة / دقائق التركيز',s.done+' / '+s.fx)}
 ${u.agt&&Object.keys(u.agt).length?R('مواعيد الصلوات المعدّلة',Object.entries(u.agt).map(([n,t])=>esc(n)+' '+fm(t)).join('، ')):''}</div>
 <div class="card"><h3>المواد</h3>${L(u.subjects,x=>`<div class="li"><span>${esc(x.name)}</span><span class="mut">${['','قوي','متوسط','محتاج مجهود'][x.w]||''}</span></div>`)}</div>
 <div class="card"><h3>المواعيد</h3>${L(u.events,e=>`<div class="li"><span><b>${esc(e.title)}</b> <span class="mut">${esc(e.kind)}</span></span><span class="mut">${fm(e.s)} - ${fm(e.e)} · ${e.days&&e.days.length?e.days.map(d=>DN[d]).join('، '):esc(e.date)}</span></div>`)}</div>
 <div class="card"><h3>الامتحانات</h3>${L(u.exams,e=>`<div class="li"><span>${esc(e.name)}</span><span class="mut">${esc(e.date)}</span></div>`)}</div>
 <div class="card"><h3>الواجبات</h3>${L(u.tasks,k=>`<div class="li"><span>${esc(k.t)} ${k.d?'(تم)':''}</span><span class="mut">${esc(k.due||'')}</span></div>`)}</div>
 <div class="card"><h3>آخر 7 أيام</h3>${days.map(d=>`<div class="li"><span>${d.k}</span><span class="mut">${d.dn} فترة · ${d.fx} دقيقة تركيز</span></div>`).join('')}</div>
 <button class="btn alt" style="color:var(--bad)" onclick="del('${esc(u.phone)}')">حذف بيانات الطالب</button></div>`;
}
function del(p){if(confirm('حذف بيانات الطالب نهائياً؟ حسابه في Authentication لازم تمسحه من Firebase Console كمان.')){SEL=null;F.collection('phones').doc(p).delete();F.collection('users').doc(p).delete()}}
function csv(){
 const H=['الاسم','الرقم','الإيميل','الديانة','الدولة','المحافظة / المنطقة','المكان','خط العرض','خط الطول','تاريخ التسجيل','آخر نشاط','المواد','عدد المواعيد','فترات مكتملة','دقائق تركيز','المرحلة الدراسية'];
 const R=U.map(u=>{const s=st(u);return[u.name,u.phone,u.email,rel(u),u.country,u.region||u.gov,u.place,u.lat,u.lng,dt(u.createdAt),dt(u.lastActive),(u.subjects||[]).map(x=>x.name).join(' | '),(u.events||[]).length,s.done,s.fx,[u.stage,u.grade,u.track].filter(Boolean).join(' - ')]});
 const Q=String.fromCharCode(34),t='\ufeff'+[H,...R].map(r=>r.map((c,i)=>i===1?Q+'='+Q+Q+c+Q+Q+Q:Q+String(c??'').replace(/"/g,Q+Q)+Q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='students.csv';a.click();
}
</script>
</body>
</html>
