<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مذاكرتي</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="مذاكرتي"><meta name="application-name" content="مذاكرتي">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16233a;--mut:#5d6b82;--line:#d9e0ea;--acc:#0f766e;--accbg:#d7f0ec;--pr:#1d4f91;--prbg:#dce8f8;--ev:#9a5b00;--evbg:#fbeccd;--bad:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1724;--card:#182235;--ink:#e8edf5;--mut:#9aa8bf;--line:#2a3750;--acc:#4fd1c1;--accbg:#12403c;--pr:#8db8ff;--prbg:#1a2f52;--ev:#f2b866;--evbg:#4a3412;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 8px;line-height:1.3}
h1{font-size:26px;font-weight:800}h2{font-size:20px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;width:100%;margin-top:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#06201d}}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;margin:0;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:99px;font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chip.on{color:#06201d}}
.err{color:var(--bad);font-weight:700;margin-top:8px;min-height:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--accbg);color:var(--acc);margin:4px 4px 0 0}
.badge.f{background:var(--evbg);color:var(--ev)}
.tl{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border-inline-start:5px solid var(--line);background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.it .tm{min-width:84px;font-size:13px;color:var(--mut);font-weight:500}
.it b{display:block}
.it.pr{border-inline-start-color:var(--pr)}.it.pr .tm{color:var(--pr)}
.it.ev{border-inline-start-color:var(--ev)}
.it.st{border-inline-start-color:var(--acc);cursor:pointer}
.it.info{opacity:.75}
.it.now{background:var(--accbg)}
.it.done b{text-decoration:line-through;opacity:.6}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 1px;font-weight:700;font-size:12.5px;border-radius:10px}
.nav button.on{color:var(--acc);background:var(--accbg)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:4px;margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.days input{width:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--bad);font-weight:700}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0));inset-inline:12px;max-width:520px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;z-index:9}
.msg{border-inline-start:4px solid var(--acc)}
.pwr{position:relative}.pwr input{padding-inline-end:72px}.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--acc);font-weight:700;padding:8px}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;transition:width .2s}
.big{font-size:56px;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.lk{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;text-decoration:underline}
:root:root .btn.alt{color:var(--ink)}
:root[data-theme=dark]{--bg:#0f1724;--card:#182235;--ink:#e8edf5;--mut:#9aa8bf;--line:#2a3750;--acc:#4fd1c1;--accbg:#12403c;--pr:#8db8ff;--prbg:#1a2f52;--ev:#f2b866;--evbg:#4a3412;--bad:#ff8a80}
:root[data-theme=dark] .btn:not(.alt),:root[data-theme=dark] .chip.on{color:#06201d}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CM=['توت','بابه','هاتور','كيهك','طوبة','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'];
const GOV={'القاهرة':[30.04,31.24],'الجيزة':[30.01,31.21],'الإسكندرية':[31.2,29.92],'القليوبية':[30.46,31.18],'الدقهلية':[31.04,31.38],'الشرقية':[30.59,31.5],'الغربية':[30.79,31.0],'المنوفية':[30.56,31.01],'البحيرة':[31.04,30.47],'كفر الشيخ':[31.11,30.94],'دمياط':[31.42,31.81],'بورسعيد':[31.27,32.3],'الإسماعيلية':[30.6,32.27],'السويس':[29.97,32.55],'الفيوم':[29.31,30.84],'بني سويف':[29.07,31.1],'المنيا':[28.11,30.75],'أسيوط':[27.18,31.19],'سوهاج':[26.56,31.7],'قنا':[26.16,32.72],'الأقصر':[25.7,32.64],'أسوان':[24.09,32.9],'البحر الأحمر':[27.26,33.81],'مطروح':[31.35,27.24],'شمال سيناء':[31.13,33.8],'جنوب سيناء':[28.24,33.62],'الوادي الجديد':[25.45,30.55]};
const MSGS=['ابدأ بأصعب مادة وانت لسه نشيط، والباقي هيبقى أسهل.','45 دقيقة تركيز أحسن من 3 ساعات مشتتة. موبايلك بعيد عنك وقت المذاكرة.','النجاح مش في الموهبة، هو في الاستمرار كل يوم حتى لو شوية.','نوم كفاية بالليل بيثبّت اللي ذاكرته. متسهرش على حساب بكرة.','اكتب ملخص بإيدك بعد كل درس، هتفتكره أكتر.','لو اتأخرت في يوم، كمّل من النهارده. مفيش داعي تحاسب نفسك.','اشرب مية واتحرك 5 دقايق بين كل فترة مذاكرة.','حل أسئلة سنين فاتت، ده أسرع طريق تعرف بيه نقط ضعفك.','اللي بتذاكره النهارده هو اللي هتفرح بيه يوم النتيجة.','راجع كل يوم 10 دقايق مما ذاكرته امبارح.'];
const MM={m:['اللهم بارك لي في وقتي وعلمي.','اللهم افتح علينا فتوح العارفين.'],c:['«أستطيع كل شيء في المسيح الذي يقويني».','الرب راعيّ فلا يعوزني شيء.']};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fm=m=>{m=((m%1440)+1440)%1440;const h=m/60|0;return (h%12||12)+':'+pad(m%60)+' '+(h>=12?'م':'ص')};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dnum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const mv=m=>pad(m/60|0)+':'+pad(m%60);
const tm=v=>{const[a,b]=(v||'0:0').split(':');return +a*60+ +b};
const LS='mozakarti_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
DB=DB||{users:{},session:null};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}};
const me=()=>DB.users[DB.session];
let S={tab:'today',date:new Date(),mode:'login',tmp:{},err:''};

/* ---------- مواعيد الصلاة (طريقة الهيئة المصرية العامة للمساحة: فجر 19.5 / عشاء 17.5) ---------- */
function prayerTimes(d,lat,lng,mt,zone){const MT=METH[mt]||METH.egypt;
 const R=Math.PI/180,Y=d.getFullYear(),M=d.getMonth(),D0=d.getDate();
 const tz=tzOff(d,zone);
 const jd=Date.UTC(Y,M,D0)/864e5+2440587.5+.5-lng/360,D=jd-2451545;
 const g=((357.529+.98560028*D)%360)*R,q=(280.459+.98564736*D)%360;
 const L=((q+1.915*Math.sin(g)+.02*Math.sin(2*g))%360)*R,e=(23.439-3.6e-7*D)*R;
 let RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;RA=((RA%24)+24)%24;
 const dec=Math.asin(Math.sin(e)*Math.sin(L));
 let eq=q/15-RA;eq=(((eq+12)%24)+24)%24-12;
 const noon=12-eq+tz-lng/15,la=lat*R;
 const ha=el=>Math.acos(Math.max(-1,Math.min(1,(Math.sin(el*R)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec)))))/R/15;
 const asrEl=Math.atan(1/(1+Math.tan(Math.abs(la-dec))))/R,m=h=>Math.round(h*60);
 return{fajr:m(noon-ha(-MT[1])),sunrise:m(noon-ha(-.833)),dhuhr:m(noon)+1,asr:m(noon+ha(asrEl)),maghrib:m(noon+ha(-.833)),isha:m(MT[2]?noon+ha(-MT[2]):noon+ha(-.833)+1.5)};
}
/* ---------- التقويم القبطي والأصوام ---------- */
function coptic(d){
 const y=d.getFullYear(),m=d.getMonth()+1,a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 const jdn=d.getDate()+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
 const jd=jdn-.5,ep=1825029.5,c2j=(Y,M,D)=>ep-1+365*(Y-1)+Math.floor(Y/4)+30*(M-1)+D;
 const Y=Math.floor(((jd-ep)*4+1463)/1461),M=Math.floor((jd-c2j(Y,1,1))/30)+1;
 return(jd-c2j(Y,M,1)+1)+' '+CM[M-1]+' '+Y;
}
function easter(y,w){
 if(w){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)}
 const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,t=d+e+114;return new Date(y,Math.floor(t/31)-1,t%31+1+13);
}
function chInfo(d,sect,w){
 const y=d.getFullYear(),n=dnum(d),o=n-dnum(easter(y,w)),mo=d.getMonth()+1,dd=d.getDate(),dw=d.getDay(),f=[],x=[];
 const F={0:'عيد القيامة المجيد','-7':'أحد الشعانين','-2':'الجمعة العظيمة',39:'عيد الصعود',49:'عيد العنصرة'}[o];if(F)f.push(F);if(w&&o===-46)f.push('أربعاء الرماد');
 if(mo==1&&dd==7)f.push('عيد الميلاد المجيد');if(mo==1&&dd==19)f.push('عيد الغطاس');if(mo==8&&dd==22)f.push('عيد صعود السيدة العذراء');
 if(sect==='أرثوذكسي'){
  if(o>=-55&&o<=-1)x.push('الصوم الكبير');
  else if(o>=-69&&o<=-67)x.push('صوم يونان');
  else if((mo==11&&dd>=25)||(mo==1&&dd<=6))x.push('صوم الميلاد');
  else if(o>=50&&n<=dnum(new Date(y,6,11)))x.push('صوم الرسل');
  else if(mo==8&&dd>=7&&dd<=21)x.push('صوم العذراء');
  else if((dw==3||dw==5)&&!(o>=0&&o<=49))x.push('صيام الأربعاء والجمعة (انقطاعي)');
 }
 return{f,x};
}
function hijri(d,latin){try{return new Intl.DateTimeFormat((latin?'en':'ar-EG')+'-u-ca-islamic-umalqura',latin?{month:'numeric'}:{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return''}}
/* ---------- بناء اليوم ---------- */
const agList=(u,pt)=>u.sect==='أرثوذكسي'?[['باكر',360],['الثالثة',540],['السادسة',720],['التاسعة',900],['الغروب',pt.maghrib,1],['النوم',1260],['نصف الليل',1410]]:[['الصباح',360],['الظهر',720],['المساء',pt.maghrib,1],['النوم',1260]];
function dayItems(u,d){
 const it=[],dow=d.getDay(),ds=iso(d),pt=prayerTimes(d,u.lat,u.lng,u.method,u.tz);
 (u.events||[]).forEach(e=>{if((e.days&&e.days.includes(dow))||e.date===ds)it.push({s:e.s,e:e.e,t:e.title,k:'ev',sub:e.kind})});
 if(u.religion==='m'){
  [['الفجر',pt.fajr],['الظهر',pt.dhuhr],['العصر',pt.asr],['المغرب',pt.maghrib],['العشاء',pt.isha]].forEach(([n,t])=>it.push({s:t,e:t+20,t:'صلاة '+n,k:'pr'}));
  it.push({s:pt.sunrise,e:pt.sunrise,t:'الشروق',k:'info'});
 }else agList(u,pt).forEach(([n,t,fx])=>{const s=fx?t:((u.agt||{})[n]??t);it.push({s,e:s+15,t:'صلاة '+n,k:'pr'})});
 const busy=it.filter(x=>x.k!=='info').map(x=>[x.s-5,x.e+5]).sort((a,b)=>a[0]-b[0]),gaps=[];let pos=u.ss;
 for(const[b0,b1]of busy){if(b1<=pos)continue;if(b0>pos)gaps.push([pos,Math.min(b0,u.se)]);pos=Math.max(pos,b1);if(pos>=u.se)break}
 if(pos<u.se)gaps.push([pos,u.se]);
 const subs=[];(u.subjects||[]).forEach(s=>{for(let i=0;i<s.w;i++)subs.push(s.name)});
 let c=dnum(d);
 gaps.forEach(([a,b])=>{let p=a;while(p+30<=b){const len=Math.min(45,b-p);it.push({s:p,e:p+len,t:subs.length?subs[c++%subs.length]:'مذاكرة حرة',k:'st',key:ds+'-'+p});p+=len+10}});
 return it.sort((a,b)=>a.s-b.s);
}
/* ---------- الواجهة ---------- */
function render(){
 const u=me();let h;
 if(!u)h=authView();else if(!u.religion||u.lat==null)h=onboard();else h=appView(u);
 $('#app').innerHTML=h;
}
function authView(){
 const m=S.mode,reg=m==='reg',rs=m==='reset',nw=reg||rs;
 return `<div class="wrap"><h1>مذاكرتي</h1><p class="mut">جدول مذاكرة بيتظبط على مواعيد دروسك وصلواتك، من أي مكان في العالم.</p>
 <div class="card">${rs?'<h3>استرجاع كلمة السر</h3>':`<div class="chips"><button class="chip ${reg?'':'on'}" onclick="S.mode='login';S.err='';render()">دخول</button><button class="chip ${reg?'on':''}" onclick="S.mode='reg';S.err='';render()">حساب جديد</button></div>`}
 ${reg?'<label for="nm">الاسم</label><input id="nm" autocomplete="name">':''}
 <label for="ph">رقم التليفون (مع كود الدولة لو من برا مصر)</label><input id="ph" type="tel" inputmode="numeric" autocomplete="tel">
 ${nw?`<label for="rq">سؤال الأمان</label><select id="rq">${RQ.map((q,i)=>`<option value="${i}">${q}</option>`).join('')}</select><label for="ra">الإجابة</label><input id="ra" autocomplete="off">`:''}
 ${pwf('pw',rs?'كلمة السر الجديدة':'كلمة السر',nw?'new-password':'current-password',nw?'meter()':'')}
 ${nw?'<div class="meter"><i id="pm"></i></div><div class="mut" id="ml"></div>':''}
 ${reg?pwf('pw2','تأكيد كلمة السر','new-password'):''}
 <div class="err" id="er">${esc(S.err)}</div>
 <button class="btn" onclick="doAuth()">${reg?'إنشاء الحساب':rs?'تغيير كلمة السر':'تسجيل الدخول'}</button>
 ${m==='login'?`<button class="lk" onclick="S.mode='reset';S.err='';render()">نسيت كلمة السر؟</button>`:rs?`<button class="lk" onclick="S.mode='login';S.err='';render()">رجوع للدخول</button>`:''}</div></div>`;
}
const RQ=['اسم أول مدرسة ليك','اسم أقرب صديق في الطفولة','اسم مدينة اتولدت فيها','اسم أول مدرس حبيته'];
const pwf=(id,lab,ac,inp)=>`<label for="${id}">${lab}</label><div class="pwr"><input id="${id}" type="password" autocomplete="${ac}" ${inp?`oninput="${inp}"`:''}><button type="button" class="eye" onclick="eye('${id}',this)">إظهار</button></div>`;
function eye(id,b){const i=$('#'+id),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'إخفاء':'إظهار'}
function meter(){const p=$('#pw').value;let c=0;if(p.length>=8)c++;if(p.length>=12)c++;if(/[a-z]/i.test(p)&&/\d/.test(p))c++;if(/[^a-z0-9]/i.test(p))c++;const b=$('#pm');b.style.width=(p?Math.max(c,1)*25:0)+'%';b.style.background=c<2?'var(--bad)':c<3?'var(--ev)':'var(--acc)';$('#ml').textContent=p?['ضعيفة','ضعيفة','متوسطة','قوية','قوية جداً'][c]:''}
const normPh=s=>String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,'');
async function hash(p,ph){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ph+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(ph+'|'+p)))}}
let FAILS={};
async function doAuth(){
 const m=S.mode,ph=normPh($('#ph').value),pw=$('#pw').value,bad=t=>{S.err=t;$('#er').textContent=t};
 if(ph.length<8||ph.length>15)return bad('اكتب رقم تليفون صحيح.');
 if(pw.length<6)return bad('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل.');
 const ra=m==='login'?'':$('#ra').value.trim().toLowerCase(),rq=m==='login'?'':$('#rq').value,hs=await hash(pw,ph);
 if(m==='reg'){
  const nm=$('#nm').value.trim();
  if(nm.length<2)return bad('اكتب اسمك.');
  if(pw!==$('#pw2').value)return bad('كلمتين السر مش زي بعض.');

const delEx=i=>{me().exams.splice(i,1);save();render()};
const addTk=()=>{const t=$('#tn').value.trim();if(!t)return toast('اكتب الواجب.');const u=me();(u.tasks=u.tasks||[]).push({t,due:$('#td').value,d:0});save();render()};
const togTk=i=>{const k=me().tasks[i];k.d=k.d?0:1;save();render()};
const delTk=i=>{me().tasks.splice(i,1);save();render()};
/* تركيز (بومودورو) */
let FX={len:25,left:1500,run:0};
const mmss=s=>pad(s/60|0)+':'+pad(s%60);
function fxV(u){
 const f=u.focus||{};let wk=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);wk+=f[iso(d)]||0}
 return `<h2>وضع التركيز</h2><div class="card"><div class="chips" style="justify-content:center">${[25,45,60].map(m=>`<button class="chip ${FX.len===m?'on':''}" onclick="fxLen(${m})">${m} دقيقة</button>`).join('')}</div>
 <div class="big" id="fxt" role="timer">${mmss(FX.left)}</div><div class="row"><button class="btn" onclick="fxToggle()">${FX.run?'إيقاف مؤقت':'ابدأ'}</button><button class="btn alt" onclick="fxReset()">إعادة</button></div></div>
 <div class="card"><div class="row"><div><b>${f[iso(new Date())]||0} دقيقة</b><div class="mut">تركيز النهارده</div></div><div><b>${wk} دقيقة</b><div class="mut">آخر 7 أيام</div></div></div></div>`;
}
const fxStop=()=>{clearInterval(FX.iv);FX.run=0};
const fxLen=m=>{fxStop();FX.len=m;FX.left=m*60;render()};
const fxReset=()=>{fxStop();FX.left=FX.len*60;render()};
function fxToggle(){
 if(FX.run){fxStop();return render()}
 FX.run=1;FX.end=Date.now()+FX.left*1000;
 FX.iv=setInterval(()=>{FX.left=Math.max(0,Math.round((FX.end-Date.now())/1000));const e=$('#fxt');if(e)e.textContent=mmss(FX.left);
  if(!FX.left){fxStop();const u=me(),k=iso(new Date());u.focus=u.focus||{};u.focus[k]=(u.focus[k]||0)+FX.len;save();FX.left=FX.len*60;notify('خلصت '+FX.len+' دقيقة تركيز. خد استراحة.');if(S.tab==='fx')render()}},500);
 render();
}
function notify(t){toast(t);try{if('Notification' in window&&Notification.permission==='granted')new Notification('مذاكرتي',{body:t})}catch(e){}}
/* حساب */
const setU=(k,v)=>{me()[k]=v;save();toast('تم الحفظ.')};
const saveName=()=>{const n=$('#pn').value.trim();if(n.length<2)return toast('اكتب اسمك.');me().name=n;save();toast('تم الحفظ.')};
async function changePw(){const u=me(),o=$('#op').value,n=$('#np').value;if(n.length<6)return toast('كلمة السر الجديدة لازم 6 على الأقل.');if(await hash(o,u.phone)!==u.hash)return toast('كلمة السر الحالية غلط.');u.hash=await hash(n,u.phone);save();toast('تم تغيير كلمة السر.');render()}
function exportData(){const u=me(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(u)],{type:'application/json'}));a.download='mozakarti-'+u.phone+'.json';a.click()}
function importData(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.phone!==me().phone)return toast('الملف ده بتاع حساب تاني.');DB.users[o.phone]=Object.assign(o,{hash:me().hash});save();toast('تم استرجاع البيانات.');render()}catch(e){toast('الملف مش صالح.')}})}
function delAcc(){if(confirm('هتتمسح كل بياناتك نهائياً. متأكد؟')){delete DB.users[DB.session];logout()}}
function setTheme(v){DB.theme=v;save();applyTheme()}
function applyTheme(){const r=document.documentElement;DB.theme&&DB.theme!=='auto'?r.setAttribute('data-theme',DB.theme):r.removeAttribute('data-theme')}
/* تثبيت كتطبيق */
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(me()&&S.tab==='today')render()});
addEventListener('appinstalled',()=>{deferredInstall=null});
function installApp(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* ---------- التذكيرات ---------- */
const fired={};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','alert');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}
setInterval(()=>{
 const u=me();if(!u||!u.religion||u.lat==null)return;
 const n=new Date(),m=n.getHours()*60+n.getMinutes();
 dayItems(u,n).forEach(x=>{
  if(x.k==='info')return;
  [[10,'بعد 10 دقايق: '],[0,'دلوقتي: ']].forEach(([b,pre])=>{
   const k=iso(n)+x.s+x.t+b;
   if(m===x.s-b&&!fired[k]){fired[k]=1;const t=pre+x.t;toast(t);try{if('Notification' in window&&Notification.permission==='granted')new Notification('مذاكرتي',{body:t})}catch(e){}}
  });
 });
},20000);
applyTheme();render();
</script>
</body>
