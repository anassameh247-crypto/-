<style>
:root{--bg:#f6f9ff;--card:#fff;--line:#d3e2f8;--margin:#e5484d;--ink:#16213e;--mut:#56637f;--acc:#2540d9;--onacc:#fff;--hy:#ffe14d;--hm:#7fe8c0;--hp:#ffb1c8;--hb:#9ed0ff;--bad:#c4262e;--accbg:#e1e8ff;--ev:#7a5a00;--evbg:#fff0a8;--disp:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1525;--card:#16203a;--line:#1c2946;--margin:#ff7075;--ink:#e8edfb;--mut:#9aa6c4;--acc:#7f9bff;--onacc:#0b1020;--hy:#8c7512;--hm:#1d7458;--hp:#8b3355;--hb:#285d92;--bad:#ff8a8f;--accbg:#1f2c55;--ev:#ffd84a;--evbg:#5a4a0c}}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.7;background-color:var(--bg);
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--margin) 75%,transparent),color-mix(in srgb,var(--margin) 75%,transparent));
 background-size:100% 34px,2px 100%;background-position:0 14px,calc(100% - 22px) 0;background-repeat:repeat,no-repeat;
 padding:env(safe-area-inset-top,0) 0 calc(88px + env(safe-area-inset-bottom,0))}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 16px 38px}
h1,h2,h3{margin:0 0 8px;line-height:1.3;font-family:var(--disp);font-weight:700}

input,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:8px 2px}
select{background:var(--card)}
input[type=checkbox]{accent-color:var(--acc)}
input:focus,select:focus{outline:0;border-bottom-color:var(--acc);box-shadow:0 2px 0 var(--acc)}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--onacc);border:1.5px solid var(--ink);border-radius:12px 4px 12px 4px;padding:11px 18px;font-weight:600;width:100%;margin-top:14px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.sm{width:auto;padding:5px 14px;margin:0;font-size:14px;box-shadow:0 2px 0 var(--ink)}

.chip.on{background:var(--hy);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.err{color:var(--bad);font-weight:600;margin-top:8px;min-height:1px}
.hero{background:var(--ink);color:var(--bg);border-radius:8px 34px 8px 34px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hero h2{font-size:40px;margin:0;line-height:1.1}.hero .dd{opacity:.8;margin-bottom:6px}
.dnav{display:flex;gap:8px}
.dnav button{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:50%;width:40px;height:40px;font-size:20px;line-height:1}
.badge{display:inline-block;padding:0 9px;border:1.5px solid currentColor;border-radius:4px;font-size:13px;font-weight:600;margin:4px 0 0 6px;transform:rotate(-2deg)}
.badge.f{background:var(--hp);color:#16213e;border-color:#16213e}
.card .badge{background:var(--evbg);color:var(--ink);border-color:var(--ink);transform:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:4px 16px 4px 16px;--hl:var(--hy)}
.it.pr{--hl:var(--hb)}.it.ev{--hl:var(--hp)}.it.info{--hl:transparent;opacity:.75;border-style:dashed}
.it.st{cursor:pointer}
.it .tm{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:62px}

.bd{flex:1;min-width:0}
.tt{display:inline;font-weight:600;font-size:17px;padding:0 3px;background:linear-gradient(transparent 58%,var(--hl) 58% 92%,transparent 92%) no-repeat right/100% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cur{color:var(--margin)}
.it.now{border-color:var(--margin);box-shadow:0 0 0 2px var(--margin)}
.it.done .tt{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:2px}
.ck{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;color:var(--margin);font-weight:700;align-self:center}
.it.done .ck{border-color:var(--margin)}
.nowl{display:flex;align-items:center;gap:8px;color:var(--margin);font-weight:700;font-size:13px}
.nowl::before,.nowl::after{content:'';flex:1;border-top:2px solid var(--margin)}
@keyframes hl{from{background-size:0 100%}}
@media(prefers-reduced-motion:no-preference){.intro .tt{animation:hl .55s calc(var(--i,0)*70ms) both}}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:2px solid var(--ink);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0))}

.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .ic{padding:3px 14px;border-radius:14px 5px 14px 5px}
.nav button.on{color:var(--ink)}.nav button.on .ic{background:var(--hy)}
.days{display:flex;flex-wrap:wrap;gap:6px}

.days input{width:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--bad);font-weight:600}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0));inset-inline:14px;max-width:520px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:4px 18px 4px 18px;font-weight:600;z-index:9}
.msg{border-radius:4px 18px 4px 18px;background:var(--hy)}.msg:nth-of-type(3n+2){background:var(--hm)}.msg:nth-of-type(3n){background:var(--hp)}
.pwr{position:relative}.pwr input{padding-inline-end:72px}
.eye{position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--acc);font-weight:700;padding:8px}
.meter{height:10px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;transition:width .2s}
.big{font-family:var(--disp);font-size:76px;font-weight:700;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.lk{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;text-decoration:underline}
</style>

<script>
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CM=['توت','بابه','هاتور','كيهك','طوبة','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'];
const GOV={'القاهرة':[30.04,31.24],'الجيزة':[30.01,31.21],'الإسكندرية':[31.2,29.92],'القليوبية':[30.46,31.18],'الدقهلية':[31.04,31.38],'الشرقية':[30.59,31.5],'الغربية':[30.79,31.0],'المنوفية':[30.56,31.01],'البحيرة':[31.04,30.47],'كفر الشيخ':[31.11,30.94],'دمياط':[31.42,31.81],'بورسعيد':[31.27,32.3],'الإسماعيلية':[30.6,32.27],'السويس':[29.97,32.55],'الفيوم':[29.31,30.84],'بني سويف':[29.07,31.1],'المنيا':[28.11,30.75],'أسيوط':[27.18,31.19],'سوهاج':[26.56,31.7],'قنا':[26.16,32.72],'الأقصر':[25.7,32.64],'أسوان':[24.09,32.9],'البحر الأحمر':[27.26,33.81],'مطروح':[31.35,27.24],'شمال سيناء':[31.13,33.8],'جنوب سيناء':[28.24,33.62],'الوادي الجديد':[25.45,30.55]};
const MSGS=['ابدأ بأصعب مادة وانت لسه نشيط، والباقي هيبقى أسهل.','45 دقيقة تركيز أحسن من 3 ساعات مشتتة. موبايلك بعيد عنك وقت المذاكرة.','النجاح مش في الموهبة، هو في الاستمرار كل يوم حتى لو شوية.','نوم كفاية بالليل بيثبّت اللي ذاكرته. متسهرش على حساب بكرة.','اكتب ملخص بإيدك بعد كل درس، هتفتكره أكتر.','لو اتأخرت في يوم، كمّل من النهارده. مفيش داعي تحاسب نفسك.','اشرب مية واتحرك 5 دقايق بين كل فترة مذاكرة.','حل أسئلة سنين فاتت، ده أسرع طريق تعرف بيه نقط ضعفك.','اللي بتذاكره النهارده هو اللي هتفرح بيه يوم النتيجة.','راجع كل يوم 10 دقايق مما ذاكرته امبارح.'];
const MM={m:['اللهم بارك لي في وقتي وعلمي.','اللهم افتح علينا فتوح العارفين.'],c:['«أستطيع كل شيء في المسيح الذي يقويني».','الرب راعيّ فلا يعوزني شيء.']};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fm=m=>{m=((m%1440)+1440)%1440;const h=m/60|0;return (h%12||12)+':'+pad(m%60)+' '+(h>=12?'م':'ص')};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dnum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const mv=m=>pad(m/60|0)+':'+pad(m%60);
const tm=v=>{const[a,b]=(v||'0:0').split(':');return +a*60+ +b};
const LS='mozakarti_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
DB=DB||{users:{},session:null};
const saveL=()=>{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}};
const save=()=>{saveL();cloudPush()};
const me=()=>DB.users[DB.session];
let S={tab:'today',date:new Date(),mode:'login',tmp:{},err:''};

/* ---------- مواعيد الصلاة (طريقة الهيئة المصرية العامة للمساحة: فجر 19.5 / عشاء 17.5) ---------- */
function prayerTimes(d,lat,lng,mt,zone){const MT=METH[mt]||METH.egypt;
 const R=Math.PI/180,Y=d.getFullYear(),M=d.getMonth(),D0=d.getDate();
 const tz=tzOff(d,zone);
 const jd=Date.UTC(Y,M,D0)/864e5+2440587.5+.5-lng/360,D=jd-2451545;
 const g=((357.529+.98560028*D)%360)*R,q=(280.459+.98564736*D)%360;
 const L=((q+1.915*Math.sin(g)+.02*Math.sin(2*g))%360)*R,e=(23.439-3.6e-7*D)*R;
 let RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;RA=((RA%24)+24)%24;
 const dec=Math.asin(Math.sin(e)*Math.sin(L));
 let eq=q/15-RA;eq=(((eq+12)%24)+24)%24-12;
 const noon=12-eq+tz-lng/15,la=lat*R;
 const ha=el=>Math.acos(Math.max(-1,Math.min(1,(Math.sin(el*R)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec)))))/R/15;
 const asrEl=Math.atan(1/(1+Math.tan(Math.abs(la-dec))))/R,m=h=>Math.round(h*60);
 return{fajr:m(noon-ha(-MT[1])),sunrise:m(noon-ha(-.833)),dhuhr:m(noon)+1,asr:m(noon+ha(asrEl)),maghrib:m(noon+ha(-.833)),isha:m(MT[2]?noon+ha(-MT[2]):noon+ha(-.833)+1.5)};
}
/* ---------- التقويم القبطي والأصوام ---------- */
function coptic(d){
 const y=d.getFullYear(),m=d.getMonth()+1,a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 const jdn=d.getDate()+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
 const jd=jdn-.5,ep=1825029.5,c2j=(Y,M,D)=>ep-1+365*(Y-1)+Math.floor(Y/4)+30*(M-1)+D;
 const Y=Math.floor(((jd-ep)*4+1463)/1461),M=Math.floor((jd-c2j(Y,1,1))/30)+1;
 return(jd-c2j(Y,M,1)+1)+' '+CM[M-1]+' '+Y;
}
function easter(y,w){
 if(w){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)}
 const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,t=d+e+114;return new Date(y,Math.floor(t/31)-1,t%31+1+13);
}
function chInfo(d,sect,w){
 const y=d.getFullYear(),n=dnum(d),o=n-dnum(easter(y,w)),mo=d.getMonth()+1,dd=d.getDate(),dw=d.getDay(),f=[],x=[];
 const F={0:'عيد القيامة المجيد','-7':'أحد الشعانين','-2':'الجمعة العظيمة',39:'عيد الصعود',49:'عيد العنصرة'}[o];if(F)f.push(F);if(w&&o===-46)f.push('أربعاء الرماد');
 if(mo==1&&dd==7)f.push('عيد الميلاد المجيد');if(mo==1&&dd==19)f.push('عيد الغطاس');if(mo==8&&dd==22)f.push('عيد صعود السيدة العذراء');
 if(sect==='أرثوذكسي'){
  if(o>=-55&&o<=-1)x.push('الصوم الكبير');
  else if(o>=-69&&o<=-67)x.push('صوم يونان');
  else if((mo==11&&dd>=25)||(mo==1&&dd<=6))x.push('صوم الميلاد');
  else if(o>=50&&n<=dnum(new Date(y,6,11)))x.push('صوم الرسل');
  else if(mo==8&&dd>=7&&dd<=21)x.push('صوم العذراء');
  else if((dw==3||dw==5)&&!(o>=0&&o<=49))x.push('صيام الأربعاء والجمعة (انقطاعي)');
 }
 return{f,x};
}
function hijri(d,latin){try{return new Intl.DateTimeFormat((latin?'en':'ar-EG')+'-u-ca-islamic-umalqura',latin?{month:'numeric'}:{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return''}}
/* ---------- بناء اليوم ---------- */
const agList=(u,pt)=>u.sect==='أرثوذكسي'?[['باكر',360],['الثالثة',540],['السادسة',720],['التاسعة',900],['الغروب',pt.maghrib,1],['النوم',1260],['نصف الليل',1410]]:[['الصباح',360],['الظهر',720],['المساء',pt.maghrib,1],['النوم',1260]];
function dayItems(u,d,nr){
 const it=[],dow=d.getDay(),ds=iso(d),pt=prayerTimes(d,u.lat,u.lng,u.method,u.tz),n=dnum(d),dd=t=>Math.round(Date.parse(t+'T00:00:00Z')/864e5-n);
 (u.events||[]).forEach(e=>{if((e.days&&e.days.includes(dow))||e.date===ds)it.push({s:e.s,e:e.e,t:e.title,k:'ev',sub:e.kind})});
 if(u.religion==='m'){
  [['الفجر',pt.fajr],['الظهر',pt.dhuhr],['العصر',pt.asr],['المغرب',pt.maghrib],['العشاء',pt.isha]].forEach(([nm,t])=>it.push({s:t,e:t+20,t:'صلاة '+nm,k:'pr'}));
  it.push({s:pt.sunrise,e:pt.sunrise,t:'الشروق',k:'info'});
 }else agList(u,pt).forEach(([nm,t,fx])=>{const s=fx?t:((u.agt||{})[nm]??t);it.push({s,e:s+15,t:'صلاة '+nm,k:'pr'})});
 const busy=it.filter(x=>x.k!=='info').map(x=>[x.s-5,x.e+5]).sort((a,b)=>a[0]-b[0]),gaps=[];let pos=u.ss;
 for(const[b0,b1]of busy){if(b1<=pos)continue;if(b0>pos)gaps.push([pos,Math.min(b0,u.se)]);pos=Math.max(pos,b1);if(pos>=u.se)break}
 if(pos<u.se)gaps.push([pos,u.se]);
 /* الجدول الذكي: وزن المادة = مستواي فيها + قرب الامتحان */
 const ex=(u.exams||[]).map(e=>({name:(e.name||'').trim(),left:dd(e.date)})).filter(e=>e.left>=0);
 const sc=(u.subjects||[]).map(s=>{const e=ex.filter(x=>x.name===s.name.trim()).sort((a,b)=>a.left-b.left)[0],l=e?e.left:99,b=l<=1?6:l<=3?4:l<=7?3:l<=14?2:l<=30?1:0;
  return{name:s.name,w:s.w+b,why:l===0?'امتحان النهارده':l===1?'امتحانك بكرة':l<=30?'امتحانك بعد '+l+' يوم':s.w===3?'محتاج مجهود منك':'',l}});
 let subs=[];const mx=Math.max(0,...sc.map(s=>s.w));for(let r=0;r<mx;r++)sc.forEach(s=>{if(s.w>r)subs.push(s)});

 return `<div class="card"><h3>دراستك (اختياري)</h3><div class="chips">${Object.keys(STG).map(x=>ch(st===x,`S.tmp.st='${x}';S.tmp.gr='';S.tmp.tk='';render()`,x)).join('')}</div>
 ${STG[st]?`<label>الصف</label><div class="chips">${GRN.slice(0,STG[st]).map(x=>ch(gr===x,`S.tmp.gr='${x}';render()`,x)).join('')}</div>`:''}
 ${st==='ثانوي'&&gr&&gr!=='الأول'?`<label>الشعبة</label><div class="chips">${Object.keys(SEC).map(x=>ch(tk===x,`S.tmp.tk='${x}';render()`,x)).join('')}</div>`:''}
 ${st&&st!=='جامعي / غير ذلك'?'<p class="mut">هنضيف موادك تلقائي وتقدر تعدلها بعدين.</p>':''}</div>`;
}
/* ---------- إشعارات التليفون (حتى لو التطبيق مقفول) ---------- */
function buildNotifs(u){
 const out=[],now=Date.now();
 for(let i=0;i<3;i++){
  const d=new Date();d.setDate(d.getDate()+i);
  const b=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),it=dayItems(u,d),st=it.filter(x=>x.k==='st'),T=m=>b+m*6e4,add=(m,body)=>out.push({t:T(m),title:'مذاكرتي',body});
  it.forEach(x=>{
   if(x.k==='ev'){add(x.s-10,`عندك ${x.sub||'موعد'} بعد 10 دقايق: ${x.t}`);add(x.s,`عندك ${x.sub||'موعد'} دلوقتي: ${x.t}`)}
   else if(x.k==='pr')add(x.s,`ميعاد ${x.t} دلوقتي`);
   else if(x.k==='st'&&!(u.done&&u.done[x.key])){add(x.s,`ابدأ المذاكرة دلوقتي: ${x.t} (${x.e-x.s} دقيقة)`);if(x!==st[st.length-1])add(x.e,'بريك! ارتاح 10 دقايق وارجع كمّل')}
  });
 }
 return out.filter(n=>n.t>now+5e3).sort((a,b)=>a.t-b.t).slice(0,150);
}
function pushUI(u,ng){
 if(!ng||!('serviceWorker' in navigator)||!('PushManager' in window))return '<p class="mut">المتصفح ده مش بيدعم إشعارات التليفون. على الآيفون ثبّت الموقع على الشاشة الرئيسية من Safari وافتحه منها (iOS 16.4 أو أحدث).</p>';
 if(u.push)return '<p class="mut">إشعارات التليفون شغالة: هتوصلك رسالة قبل الدرس، ووقت الصلاة، وبداية المذاكرة، والبريك، حتى لو التطبيق مقفول.</p><button class="btn alt" onclick="disablePush()">إيقاف الإشعارات</button>';
 return '<p class="mut">فعّل الإشعارات عشان توصلك رسايل قبل الدرس، ووقت الصلاة، وبداية المذاكرة والبريك، حتى لو التطبيق مقفول.</p><button class="btn" onclick="enablePush()">فعّل إشعارات التليفون</button>';
}
const u8=b=>{const r=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function enablePush(){
 if(!CLOUD||!window.VAPID_PUBLIC)return toast('الإشعارات لسه محتاجة تجهيز من صاحب الموقع.');
 try{
  if(await Notification.requestPermission()!=='granted')return toast('لازم تسمح بالإشعارات من إعدادات المتصفح.');
  const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUBLIC)});
  me().push=sub.toJSON();save();render();toast('تم تفعيل الإشعارات.');
 }catch(e){toast('مقدرناش نفعّل الإشعارات. جرب تاني.')}
}
async function disablePush(){
 try{const s=await(await navigator.serviceWorker.ready).pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){}
 const u=me();delete u.push;saveL();
 if(CLOUD&&FA.currentUser)try{const D=firebase.firestore.FieldValue.delete();await FS.collection('users').doc(u.phone).update({push:D,notifs:[],nextAt:D})}catch(e){}
 render();
}
if(CLOUD)addEventListener('load',()=>setTimeout(()=>{if(me()&&me().push)cloudPush()},4000));
/* ---------- التذكيرات ---------- */
const fired={};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','alert');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}
setInterval(()=>{
 const u=me();if(!u||!u.religion||u.lat==null)return;
 const n=new Date(),m=n.getHours()*60+n.getMinutes();
 dayItems(u,n).forEach(x=>{
  if(x.k==='info')return;
  [[10,'بعد 10 دقايق: '],[0,'دلوقتي: ']].forEach(([b,pre])=>{
   const k=iso(n)+x.s+x.t+b;
   if(m===x.s-b&&!fired[k]){fired[k]=1;const t=pre+x.t;toast(t);try{if('Notification' in window&&Notification.permission==='granted'&&!(me()&&me().push))new Notification('مذاكرتي',{body:t})}catch(e){}}
  });
 });
},20000);
applyTheme();intro();render();
</script>
