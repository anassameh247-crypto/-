<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16233a;--mut:#5d6b82;--line:#d9e0ea;--acc:#0f766e;--accbg:#d7f0ec;--pr:#1d4f91;--prbg:#dce8f8;--ev:#9a5b00;--evbg:#fbeccd;--bad:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1724;--card:#182235;--ink:#e8edf5;--mut:#9aa8bf;--line:#2a3750;--acc:#4fd1c1;--accbg:#12403c;--pr:#8db8ff;--prbg:#1a2f52;--ev:#f2b866;--evbg:#4a3412;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 8px;line-height:1.3}
h1{font-size:26px;font-weight:800}h2{font-size:20px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;width:100%;margin-top:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#06201d}}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;margin:0;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:99px;font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chip.on{color:#06201d}}
.err{color:var(--bad);font-weight:700;margin-top:8px;min-height:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--accbg);color:var(--acc);margin:4px 4px 0 0}
.badge.f{background:var(--evbg);color:var(--ev)}
.tl{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border-inline-start:5px solid var(--line);background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.it .tm{min-width:84px;font-size:13px;color:var(--mut);font-weight:500}
.it b{display:block}
.it.pr{border-inline-start-color:var(--pr)}.it.pr .tm{color:var(--pr)}
.it.ev{border-inline-start-color:var(--ev)}
.it.st{border-inline-start-color:var(--acc);cursor:pointer}
.it.info{opacity:.75}
.it.now{background:var(--accbg)}
.it.done b{text-decoration:line-through;opacity:.6}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font-weight:700;font-size:14px;border-radius:10px}
.nav button.on{color:var(--acc);background:var(--accbg)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:4px;margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.days input{width:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--bad);font-weight:700}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0));inset-inline:12px;max-width:520px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;z-index:9}
.msg{border-inline-start:4px solid var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CM=['توت','بابه','هاتور','كيهك','طوبة','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'];
const GOV={'القاهرة':[30.04,31.24],'الجيزة':[30.01,31.21],'الإسكندرية':[31.2,29.92],'القليوبية':[30.46,31.18],'الدقهلية':[31.04,31.38],'الشرقية':[30.59,31.5],'الغربية':[30.79,31.0],'المنوفية':[30.56,31.01],'البحيرة':[31.04,30.47],'كفر الشيخ':[31.11,30.94],'دمياط':[31.42,31.81],'بورسعيد':[31.27,32.3],'الإسماعيلية':[30.6,32.27],'السويس':[29.97,32.55],'الفيوم':[29.31,30.84],'بني سويف':[29.07,31.1],'المنيا':[28.11,30.75],'أسيوط':[27.18,31.19],'سوهاج':[26.56,31.7],'قنا':[26.16,32.72],'الأقصر':[25.7,32.64],'أسوان':[24.09,32.9],'البحر الأحمر':[27.26,33.81],'مطروح':[31.35,27.24],'شمال سيناء':[31.13,33.8],'جنوب سيناء':[28.24,33.62],'الوادي الجديد':[25.45,30.55]};
const MSGS=['ابدأ بأصعب مادة وانت لسه نشيط، والباقي هيبقى أسهل.','45 دقيقة تركيز أحسن من 3 ساعات مشتتة. موبايلك بعيد عنك وقت المذاكرة.','النجاح مش في الموهبة، هو في الاستمرار كل يوم حتى لو شوية.','نوم كفاية بالليل بيثبّت اللي ذاكرته. متسهرش على حساب بكرة.','اكتب ملخص بإيدك بعد كل درس، هتفتكره أكتر.','لو اتأخرت في يوم، كمّل من النهارده. مفيش داعي تحاسب نفسك.','اشرب مية واتحرك 5 دقايق بين كل فترة مذاكرة.','حل أسئلة سنين فاتت، ده أسرع طريق تعرف بيه نقط ضعفك.','اللي بتذاكره النهارده هو اللي هتفرح بيه يوم النتيجة.','راجع كل يوم 10 دقايق مما ذاكرته امبارح.'];
const MM={m:['اللهم بارك لي في وقتي وعلمي.','اللهم افتح علينا فتوح العارفين.'],c:['«أستطيع كل شيء في المسيح الذي يقويني».','الرب راعيّ فلا يعوزني شيء.']};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fm=m=>{m=((m%1440)+1440)%1440;const h=m/60|0;return (h%12||12)+':'+pad(m%60)+' '+(h>=12?'م':'ص')};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dnum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const mv=m=>pad(m/60|0)+':'+pad(m%60);
const tm=v=>{const[a,b]=(v||'0:0').split(':');return +a*60+ +b};
const LS='mozakarti_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
DB=DB||{users:{},session:null};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}};
const me=()=>DB.users[DB.session];
let S={tab:'today',date:new Date(),mode:'login',tmp:{},err:''};

/* ---------- مواعيد الصلاة (طريقة الهيئة المصرية العامة للمساحة: فجر 19.5 / عشاء 17.5) ---------- */
function prayerTimes(d,lat,lng){
 const R=Math.PI/180,Y=d.getFullYear(),M=d.getMonth(),D0=d.getDate();
 const tz=-new Date(Y,M,D0,12).getTimezoneOffset()/60;
 const jd=Date.UTC(Y,M,D0)/864e5+2440587.5+.5-lng/360,D=jd-2451545;
 const g=((357.529+.98560028*D)%360)*R,q=(280.459+.98564736*D)%360;
 const L=((q+1.915*Math.sin(g)+.02*Math.sin(2*g))%360)*R,e=(23.439-3.6e-7*D)*R;
 let RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;RA=((RA%24)+24)%24;
 const dec=Math.asin(Math.sin(e)*Math.sin(L));
 let eq=q/15-RA;eq=(((eq+12)%24)+24)%24-12;
 const noon=12-eq+tz-lng/15,la=lat*R;
 const ha=el=>Math.acos((Math.sin(el*R)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec)))/R/15;
 const asrEl=Math.atan(1/(1+Math.tan(Math.abs(la-dec))))/R,m=h=>Math.round(h*60);
 return{fajr:m(noon-ha(-19.5)),sunrise:m(noon-ha(-.833)),dhuhr:m(noon)+1,asr:m(noon+ha(asrEl)),maghrib:m(noon+ha(-.833)),isha:m(noon+ha(-17.5))};
}
/* ---------- التقويم القبطي والأصوام ---------- */
function coptic(d){
 const y=d.getFullYear(),m=d.getMonth()+1,a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 const jdn=d.getDate()+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
 const jd=jdn-.5,ep=1825029.5,c2j=(Y,M,D)=>ep-1+365*(Y-1)+Math.floor(Y/4)+30*(M-1)+D;
 const Y=Math.floor(((jd-ep)*4+1463)/1461),M=Math.floor((jd-c2j(Y,1,1))/30)+1;
 return(jd-c2j(Y,M,1)+1)+' '+CM[M-1]+' '+Y;
}
function easter(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,s=d+e+114;return new Date(y,Math.floor(s/31)-1,s%31+1+13)}
function chInfo(d,sect){
 const y=d.getFullYear(),n=dnum(d),o=n-dnum(easter(y)),mo=d.getMonth()+1,dd=d.getDate(),dw=d.getDay(),f=[],x=[];
 const F={0:'عيد القيامة المجيد','-7':'أحد الشعانين','-2':'الجمعة العظيمة',39:'عيد الصعود',49:'عيد العنصرة'}[o];if(F)f.push(F);
 if(mo==1&&dd==7)f.push('عيد الميلاد المجيد');if(mo==1&&dd==19)f.push('عيد الغطاس');if(mo==8&&dd==22)f.push('عيد صعود السيدة العذراء');
 if(sect==='أرثوذكسي'){
  if(o>=-55&&o<=-1)x.push('الصوم الكبير');
  else if(o>=-69&&o<=-67)x.push('صوم يونان');
  else if((mo==11&&dd>=25)||(mo==1&&dd<=6))x.push('صوم الميلاد');
  else if(o>=50&&n<=dnum(new Date(y,6,11)))x.push('صوم الرسل');
  else if(mo==8&&dd>=7&&dd<=21)x.push('صوم العذراء');
  else if((dw==3||dw==5)&&!(o>=0&&o<=49))x.push('صيام الأربعاء والجمعة (انقطاعي)');
 }
 return{f,x};
}
function hijri(d,latin){try{return new Intl.DateTimeFormat((latin?'en':'ar-EG')+'-u-ca-islamic-umalqura',latin?{month:'numeric'}:{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return''}}
/* ---------- بناء اليوم ---------- */
const agList=(u,pt)=>u.sect==='أرثوذكسي'?[['باكر',360],['الثالثة',540],['السادسة',720],['التاسعة',900],['الغروب',pt.maghrib,1],['النوم',1260],['نصف الليل',1410]]:[['الصباح',360],['الظهر',720],['المساء',pt.maghrib,1],['النوم',1260]];
function dayItems(u,d){
 const it=[],dow=d.getDay(),ds=iso(d),pt=prayerTimes(d,u.lat,u.lng);
 (u.events||[]).forEach(e=>{if((e.days&&e.days.includes(dow))||e.date===ds)it.push({s:e.s,e:e.e,t:e.title,k:'ev',sub:e.kind})});
 if(u.religion==='m'){
  [['الفجر',pt.fajr],['الظهر',pt.dhuhr],['العصر',pt.asr],['المغرب',pt.maghrib],['العشاء',pt.isha]].forEach(([n,t])=>it.push({s:t,e:t+20,t:'صلاة '+n,k:'pr'}));
  it.push({s:pt.sunrise,e:pt.sunrise,t:'الشروق',k:'info'});
 }else agList(u,pt).forEach(([n,t,fx])=>{const s=fx?t:((u.agt||{})[n]??t);it.push({s,e:s+15,t:'صلاة '+n,k:'pr'})});
 const busy=it.filter(x=>x.k!=='info').map(x=>[x.s-5,x.e+5]).sort((a,b)=>a[0]-b[0]),gaps=[];let pos=u.ss;
 for(const[b0,b1]of busy){if(b1<=pos)continue;if(b0>pos)gaps.push([pos,Math.min(b0,u.se)]);pos=Math.max(pos,b1);if(pos>=u.se)break}
 if(pos<u.se)gaps.push([pos,u.se]);
 const subs=[];(u.subjects||[]).forEach(s=>{for(let i=0;i<s.w;i++)subs.push(s.name)});
 let c=dnum(d);
 gaps.forEach(([a,b])=>{let p=a;while(p+30<=b){const len=Math.min(45,b-p);it.push({s:p,e:p+len,t:subs.length?subs[c++%subs.length]:'مذاكرة حرة',k:'st',key:ds+'-'+p});p+=len+10}});
 return it.sort((a,b)=>a.s-b.s);
}
/* ---------- الواجهة ---------- */
function render(){
 const u=me();let h;
 if(!u)h=authView();else if(!u.religion||u.lat==null)h=onboard();else h=appView(u);
 $('#app').innerHTML=h;
}
function authView(){
 const reg=S.mode==='reg';
 return `<div class="wrap"><h1>مذاكرتي</h1><p class="mut">جدول مذاكرة يتظبط على مواعيد دروسك وصلواتك.</p>
 <div class="card"><div class="chips"><button class="chip ${reg?'':'on'}" onclick="S.mode='login';S.err='';render()">دخول</button><button class="chip ${reg?'on':''}" onclick="S.mode='reg';S.err='';render()">حساب جديد</button></div>
 ${reg?'<label for="nm">الاسم</label><input id="nm" autocomplete="name">':''}
 <label for="ph">رقم التليفون</label><input id="ph" type="tel" inputmode="numeric" autocomplete="tel">
 <label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}">
 <div class="err" id="er">${esc(S.err)}</div>
 <button class="btn" onclick="doAuth()">${reg?'إنشاء الحساب':'تسجيل الدخول'}</button></div></div>`;
}
const normPh=s=>String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,'');
async function hash(p,ph){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ph+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(ph+'|'+p)))}}
async function doAuth(){
 const ph=normPh($('#ph').value),pw=$('#pw').value,reg=S.mode==='reg',nm=reg?$('#nm').value.trim():'';
 const bad=m=>{S.err=m;$('#er').textContent=m};
 if(ph.length<10||ph.length>15)return bad('اكتب رقم تليفون صحيح.');
 if(pw.length<6)return bad('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل.');
 const hs=await hash(pw,ph);
 if(reg){
  if(nm.length<2)return bad('اكتب اسمك.');
  if(DB.users[ph])return bad('الرقم ده عنده حساب بالفعل. سجّل دخول.');
  DB.users[ph]={name:nm,phone:ph,hash:hs,ss:900,se:1320,events:[],subjects:[],done:{}};
 }else{
  const u=DB.users[ph];if(!u||u.hash!==hs)return bad('الرقم أو كلمة السر غلط.');
 }
 DB.session=ph;save();S.err='';S.tab='today';S.tmp={};render();
}
function logout(){DB.session=null;save();S.mode='login';render()}
function onboard(){
 const t=S.tmp,u=me(),ch=(on,fn,txt)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${txt}</button>`;
 return `<div class="wrap"><h1>أهلاً ${esc(u.name)}</h1><p class="mut">كام سؤال بسيط عشان نظبط مواعيدك.</p>
 <div class="card"><h3>انت مسلم ولا مسيحي؟</h3><div class="chips">${ch(t.r==='m',"S.tmp.r='m';render()",'مسلم')}${ch(t.r==='c',"S.tmp.r='c';render()",'مسيحي')}</div>
 ${t.r==='c'?`<label>الطائفة</label><div class="chips">${['أرثوذكسي','كاثوليكي','إنجيلي'].map(s=>ch(t.sect===s,`S.tmp.sect='${s}';render()`,s)).join('')}</div>`:''}</div>
 <div class="card"><h3>مكانك</h3><p class="mut">بنحسب مواعيد الصلاة والغروب من إحداثياتك.</p>
 <button class="btn alt" onclick="locate()">حدد موقعي بالتليفون</button>
 <label for="gv">أو اختار محافظتك</label><select id="gv" onchange="pickGov(this.value)"><option value="">اختار...</option>${Object.keys(GOV).map(g=>`<option ${t.place===g?'selected':''}>${g}</option>`).join('')}</select>
 ${t.lat!=null?`<p class="badge">تم تحديد: ${esc(t.place)}</p>`:''}<div class="err">${esc(S.err)}</div></div>
 <button class="btn" onclick="finishOnb()">ابدأ</button></div>`;
}
function locate(){
 if(!navigator.geolocation){S.err='المتصفح مش بيدعم تحديد الموقع. اختار محافظتك.';return render()}
 navigator.geolocation.getCurrentPosition(p=>{S.tmp.lat=p.coords.latitude;S.tmp.lng=p.coords.longitude;S.tmp.place='موقعك الحالي';S.err='';render()},()=>{S.err='مقدرناش نحدد موقعك. اسمح بالإذن أو اختار محافظتك.';render()},{timeout:12000});
}
function pickGov(v){if(!v)return;S.tmp.lat=GOV[v][0];S.tmp.lng=GOV[v][1];S.tmp.place=v;S.err='';render()}
function finishOnb(){
 const t=S.tmp,u=me();
 if(!t.r)return S.err='اختار الديانة الأول.',render();
 if(t.r==='c'&&!t.sect)return S.err='اختار الطائفة.',render();
 if(t.lat==null)return S.err='حدد مكانك الأول.',render();
 Object.assign(u,{religion:t.r,sect:t.r==='c'?t.sect:'',lat:t.lat,lng:t.lng,place:t.place});save();S.tmp={};render();
}
function appView(u){
 const tabs=[['today','اليوم'],['ev','المواعيد'],['st','المذاكرة'],['msg','رسائل'],['me','حسابي']];
 const body={today:todayV,ev:evV,st:stV,msg:msgV,me:meV}[S.tab](u);
 return `<div class="wrap">${body}</div><nav class="nav">${tabs.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${n}</button>`).join('')}</nav>`;
}
function todayV(u){
 const d=S.date,it=dayItems(u,d),now=new Date(),isT=iso(d)===iso(now),nm=now.getHours()*60+now.getMinutes();
 let info='';
 if(u.religion==='m'){const hm=hijri(d);info=`<span class="badge">${hm}</span>`;if(hijri(d,1)==9)info+='<span class="badge f">رمضان</span>';if(d.getDay()===5)info+='<span class="badge">يوم الجمعة</span>'}
 else{const c=chInfo(d,u.sect);info=`<span class="badge">${coptic(d)}</span>`+c.f.map(x=>`<span class="badge">${x}</span>`).join('')+c.x.map(x=>`<span class="badge f">${x}</span>`).join('')}
 const rows=it.map(x=>{const dn=u.done&&u.done[x.key],cur=isT&&x.s<=nm&&nm<x.e;
  return `<li class="it ${x.k} ${cur?'now':''} ${dn?'done':''}" ${x.k==='st'?`onclick="toggleDone('${x.key}')"`:''}><span class="tm">${x.k==='info'?fm(x.s):fm(x.s)+'<br>'+fm(x.e)}</span><span><b>${esc(x.t)}</b><span class="mut">${x.k==='st'?(dn?'خلصت ✓':'دوس لما تخلص'):esc(x.sub||'')}</span></span></li>`}).join('');
 return `<div class="top"><div><h2>${DN[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</h2><div>${info}</div></div><div class="dnav"><button aria-label="اليوم التالي" onclick="shift(1)">›</button><button aria-label="اليوم السابق" onclick="shift(-1)">‹</button></div></div>
 ${isT?'':'<button class="btn alt sm" style="margin-bottom:10px" onclick="S.date=new Date();render()">ارجع لليوم</button>'}
 <ul class="tl">${rows||'<li class="card mut">مفيش حاجة في اليوم ده.</li>'}</ul>
 ${(u.subjects||[]).length?'':'<p class="mut">ضيف موادك من تبويب «المذاكرة» عشان الجدول يتوزع عليها.</p>'}`;
}
const shift=n=>{S.date=new Date(S.date.getFullYear(),S.date.getMonth(),S.date.getDate()+n);render()};
function toggleDone(k){const u=me();u.done=u.done||{};u.done[k]=!u.done[k];save();render()}
function evV(u){
 const list=(u.events||[]).map((e,i)=>`<div class="li"><span><b>${esc(e.title)}</b><br><span class="mut">${esc(e.kind)} · ${fm(e.s)} - ${fm(e.e)} · ${e.days&&e.days.length?e.days.map(x=>DN[x]).join('، '):e.date}</span></span><button class="x" onclick="delEv(${i})">حذف</button></div>`).join('');
 return `<h2>المواعيد</h2><p class="mut">دروسك والتزاماتك. جدول المذاكرة بيتفادها.</p>
 <div class="card"><label for="et">الاسم</label><input id="et" placeholder="مثلاً: درس فيزياء">
 <label for="ek">النوع</label><select id="ek"><option>درس</option><option>مدرسة</option><option>عبادة (قداس / جمعة...)</option><option>تمرين / نشاط</option><option>حاجة تانية</option></select>
 <div class="row"><div><label for="es">من</label><input id="es" type="time" value="16:00"></div><div><label for="ee">إلى</label><input id="ee" type="time" value="17:30"></div></div>
 <label>بيتكرر كل أسبوع في:</label><div class="days">${DN.map((n,i)=>`<label><input type="checkbox" class="ed" value="${i}">${n}</label>`).join('')}</div>
 <label for="edt">أو مرة واحدة في تاريخ</label><input id="edt" type="date">
 <div class="err" id="er"></div><button class="btn" onclick="addEv()">إضافة الموعد</button></div>
 <div class="card">${list||'<span class="mut">لسه مضفتش مواعيد.</span>'}</div>`;
}
function addEv(){
 const u=me(),t=$('#et').value.trim(),s=tm($('#es').value),e=tm($('#ee').value),days=[...document.querySelectorAll('.ed:checked')].map(x=>+x.value),date=$('#edt').value;
 const bad=m=>{$('#er').textContent=m};
 if(!t)return bad('اكتب اسم الموعد.');if(e<=s)return bad('وقت النهاية لازم يكون بعد البداية.');if(!days.length&&!date)return bad('اختار أيام الأسبوع أو تاريخ.');
 u.events.push({title:t,kind:$('#ek').value,s,e,days:days.length?days:null,date:days.length?null:date});save();render();
}
function delEv(i){me().events.splice(i,1);save();render()}
function stV(u){
 const list=(u.subjects||[]).map((s,i)=>`<div class="li"><span><b>${esc(s.name)}</b> <span class="mut">${['','عادية','مهمة','أولوية عالية'][s.w]}</span></span><button class="x" onclick="delSub(${i})">حذف</button></div>`).join('');
 return `<h2>المذاكرة</h2>
 <div class="card"><h3>وقت المذاكرة في اليوم</h3><div class="row"><div><label for="ss">من</label><input id="ss" type="time" value="${mv(u.ss)}" onchange="setWin()"></div><div><label for="se">إلى</label><input id="se" type="time" value="${mv(u.se)}" onchange="setWin()"></div></div>
 <p class="mut">الجدول بيقسم الوقت الفاضي لفترات 45 دقيقة واستراحة 10 دقايق.</p></div>
 <div class="card"><h3>المواد</h3><div class="row"><div style="flex:2"><input id="sn" placeholder="اسم المادة" aria-label="اسم المادة"></div><div><select id="sw" aria-label="الأولوية"><option value="1">عادية</option><option value="2">مهمة</option><option value="3">أولوية عالية</option></select></div></div>
 <div class="err" id="er"></div><button class="btn" onclick="addSub()">إضافة مادة</button>${list?'<div style="margin-top:10px">'+list+'</div>':''}</div>`;
}
function setWin(){const u=me(),a=tm($('#ss').value),b=tm($('#se').value);if(b>a+30){u.ss=a;u.se=b;save()}else{$('#ss').value=mv(u.ss);$('#se').value=mv(u.se)}}
function addSub(){const n=$('#sn').value.trim();if(!n)return $('#er').textContent='اكتب اسم المادة.';me().subjects.push({name:n,w:+$('#sw').value});save();render()}
function delSub(i){me().subjects.splice(i,1);save();render()}
function msgV(u){
 const n=dnum(new Date()),L=[];
 for(let i=0;i<7;i++){const d=n-i,p=MM[u.religion];L.push({d:new Date(d*864e5+43200000),t:MSGS[d%MSGS.length]+(i%2===0?' '+p[d%p.length]:'')})}
 return `<h2>رسائل</h2><div class="card msg"><b>أهلاً ${esc(u.name)}</b><br>جدولك جاهز في تبويب «اليوم». اضغط على أي فترة مذاكرة لما تخلصها.</div>`+
 L.map((m,i)=>`<div class="card msg"><div class="mut">${i===0?'النهارده':DN[m.d.getUTCDay()]}</div>${m.t}</div>`).join('');
}
function meV(u){
 const fixed=u.religion==='c'?agList(u,{maghrib:0}).filter(x=>!x[2]):[];
 return `<h2>حسابي</h2><div class="card"><b>${esc(u.name)}</b><div class="mut">${esc(u.phone)}</div><div class="mut">${u.religion==='m'?'مسلم':'مسيحي · '+esc(u.sect)} · ${esc(u.place)}</div>
 <button class="btn alt" onclick="me().lat=null;S.tmp={r:me().religion,sect:me().sect};render()">تغيير الديانة أو المكان</button></div>
 <div class="card"><h3>التذكيرات</h3><p class="mut">بنبعت تنبيه قبل كل صلاة ومذاكرة بـ 10 دقايق طول ما الموقع مفتوح.</p><div id="nst" class="mut">${'Notification' in window?(Notification.permission==='granted'?'التنبيهات شغالة.':'التنبيهات مقفولة.'):'المتصفح مش بيدعم التنبيهات، هتظهر لك جوه الموقع.'}</div>
 ${'Notification' in window&&Notification.permission!=='granted'?'<button class="btn" onclick="askN()">شغّل التنبيهات</button>':''}</div>
 ${fixed.length?`<div class="card"><h3>مواعيد الصلوات (تقدر تعدلها)</h3>${fixed.map(([n,t])=>`<div class="li"><span>${n}</span><input type="time" style="width:130px" value="${mv((u.agt||{})[n]??t)}" onchange="setAg('${n}',this.value)" aria-label="${n}"></div>`).join('')}<p class="mut">الغروب بيتحسب تلقائي حسب مكانك.</p></div>`:''}
 <button class="btn alt" onclick="logout()">تسجيل الخروج</button>`;
}
function setAg(n,v){const u=me();u.agt=u.agt||{};u.agt[n]=tm(v);save()}
function askN(){Notification.requestPermission().then(()=>render())}
/* ---------- التذكيرات ---------- */
const fired={};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','alert');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}
setInterval(()=>{
 const u=me();if(!u||!u.religion||u.lat==null)return;
 const n=new Date(),m=n.getHours()*60+n.getMinutes();
 dayItems(u,n).forEach(x=>{
  if(x.k==='info')return;
  [[10,'بعد 10 دقايق: '],[0,'دلوقتي: ']].forEach(([b,pre])=>{
   const k=iso(n)+x.s+x.t+b;
   if(m===x.s-b&&!fired[k]){fired[k]=1;const t=pre+x.t;toast(t);try{if('Notification' in window&&Notification.permission==='granted')new Notification('مذاكرتي',{body:t})}catch(e){}}
  });
 });
},20000);
render();
</script>
</body>
</html>
